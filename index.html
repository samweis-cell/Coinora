<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinora</title>
  
  <!-- PWA & Mobile Web App Support -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coinora">
  
  <!-- Manifest & Web App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://img.icons8.com/isometric/512/cheap-2.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/isometric/512/cheap-2.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Kopfzeile mit App-Name, Umschalter & Version -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700/50 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide">Coinora</h1>
        <p class="text-xs text-slate-400">Münzsammlung</p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Umschalter: Bearbeiten vs. Beobachten -->
        <button id="toggle-edit-btn" onclick="toggleEditMode()" class="text-xs px-3 py-1.5 rounded-xl border transition font-medium flex items-center gap-1.5 bg-slate-700 border-slate-600 text-slate-200 hover:bg-slate-600">
          <span id="mode-icon">✏️</span>
          <span id="mode-label">Bearbeiten</span>
        </button>

        <!-- Versionsanzeige -->
        <span id="app-version" class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1.5 rounded-xl font-mono font-bold">
          v1.1.4
        </span>
      </div>
    </div>

    <!-- Kategorie-Aktivierung -->
    <div class="grid grid-cols-2 gap-4">
      <button id="btn-laender" onclick="selectCategory('laender')" class="p-4 bg-slate-800 rounded-2xl border-2 border-indigo-500 font-medium text-left transition shadow-md">
        🌍 Kursmünzen
      </button>
      <button id="btn-gedenk" onclick="selectCategory('gedenk')" class="p-4 bg-slate-800 rounded-2xl border-2 border-transparent font-medium text-left transition shadow-md text-slate-400">
        ⭐ 2€ Gedenkmünzen
      </button>
    </div>

    <!-- Neues Land hinzufügen -->
    <div id="add-country-box" class="bg-slate-800 p-4 rounded-2xl border border-slate-700/50 shadow-lg space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Eintrag hinzufügen</h2>
      <div class="flex gap-2">
        <input type="text" id="new-country-name" placeholder="z. B. Deutschland..." class="flex-1 p-3 border border-slate-600 rounded-xl bg-slate-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addCountry()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-medium hover:bg-indigo-500 transition shadow-md">
          Hinzufügen
        </button>
      </div>
    </div>

    <!-- Raster der erfassten Länder -->
    <div class="space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Übersicht</h2>
      <div id="country-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <p class="text-sm text-slate-500 italic col-span-2 sm:col-span-3">Lade Einträge...</p>
      </div>
    </div>

  </div>

  <!-- Detail-Modal für Münzen eines Landes -->
  <div id="coin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-5 max-w-xl w-full space-y-3 max-h-[92vh] flex flex-col shadow-2xl text-white">
      
      <div class="flex justify-between items-center border-b border-slate-700 pb-2.5">
        <h3 id="modal-title" class="font-bold text-lg text-white">Münzen verwalten</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <!-- Eingabebereich für neue Münzen -->
      <div id="add-coin-box" class="bg-slate-900 p-3.5 rounded-2xl border border-slate-700 space-y-2.5 flex-shrink-0">
        
        <div>
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Schnellauswahl Münzwert</span>
          <div class="flex flex-wrap gap-1">
            <button onclick="setCoinValue('1 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-md text-slate-200 transition font-medium">1 ct</button>
            <button onclick="setCoinValue('2 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">2 ct</button>
            <button onclick="setCoinValue('5 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">5 ct</button>
            <button onclick="setCoinValue('10 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">10 ct</button>
            <button onclick="setCoinValue('20 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">20 ct</button>
            <button onclick="setCoinValue('50 Cent')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">50 ct</button>
            <button onclick="setCoinValue('1 Euro')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">1 €</button>
            <button onclick="setCoinValue('2 Euro')" class="px-2 py-0.5 text-xs bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 rounded-lg text-slate-200 transition font-medium">2 €</button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="text" id="coin-value" placeholder="Wert (z. B. 2 Euro, 5 Cent)" class="p-2 border border-slate-700 rounded-xl bg-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <input type="text" id="coin-title" placeholder="Motiv / Jahr / Name (optional)" class="p-2 border border-slate-700 rounded-xl bg-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <label class="flex items-center justify-center gap-1.5 p-2 border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl bg-slate-800 text-xs text-slate-300 cursor-pointer transition">
            🖼️ <span>Bild aus Galerie</span>
            <input type="file" id="coin-image-file" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
          </label>
          <input type="text" id="coin-image-url" placeholder="Oder Bild-URL..." class="p-2 border border-slate-700 rounded-xl bg-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div id="image-preview-container" class="hidden flex items-center gap-3 bg-slate-800 p-2 rounded-xl border border-slate-700">
          <img id="image-preview" src="" class="w-10 h-10 object-cover rounded-lg border border-slate-600">
          <span class="text-xs text-emerald-400 font-medium">Bild ausgewählt!</span>
          <button onclick="removeSelectedImage()" class="ml-auto text-xs text-rose-400 hover:text-rose-300 p-1">Entfernen</button>
        </div>
        
        <div class="flex items-center justify-between pt-0.5">
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer text-slate-300">
            <input type="checkbox" id="coin-owned" class="w-4 h-4 text-indigo-600 rounded accent-indigo-500">
            Vorhanden
          </label>
          <button onclick="saveCoin()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-medium hover:bg-indigo-500 transition shadow">
            Münze speichern
          </button>
        </div>
      </div>

      <!-- Münz-Grid -->
      <div id="coin-list" class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto flex-1 pr-1 py-1">
      </div>

      <button onclick="closeModal()" class="w-full py-2 bg-slate-700 text-slate-200 font-medium rounded-xl hover:bg-slate-600 transition text-sm flex-shrink-0">
        Schließen
      </button>
    </div>
  </div>

  <!-- Verbessertes Lightbox Modal (Großansicht) -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-[60]" onclick="closeLightbox()">
    <div class="relative max-w-xl w-full flex flex-col items-center justify-center p-2" onclick="event.stopPropagation()">
      <button onclick="closeLightbox()" class="absolute top-0 right-2 text-white/80 hover:text-white text-2xl font-bold bg-slate-800/80 w-10 h-10 rounded-full border border-slate-700 shadow flex items-center justify-center z-10">✕</button>
      <div class="w-full max-h-[75vh] flex items-center justify-center overflow-hidden rounded-2xl bg-slate-950 border border-slate-700 shadow-2xl p-2 mb-3">
        <img id="lightbox-image" src="" class="max-h-[70vh] w-auto max-w-full object-contain rounded-xl">
      </div>
      <p id="lightbox-caption" class="text-slate-100 font-semibold text-center text-base bg-slate-800/90 px-5 py-2.5 rounded-xl border border-slate-700 shadow max-w-full truncate"></p>
    </div>
  </div>

  <script src="app.js?v=1.1.4"></script>
</body>
</html>

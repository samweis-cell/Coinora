<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinora</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Kopfzeile mit App-Name und Versionsnummer -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-slate-700/50 shadow-lg">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide">Coinora</h1>
        <p class="text-xs text-slate-400">Münzsammlung</p>
      </div>
      <!-- Versionsanzeige -->
      <span id="app-version" class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-md font-mono font-bold">
        v1.0.4
      </span>
    </div>

    <!-- Kategorie-Aktivierung (Kursmünzen vs. Gedenkmünzen) -->
    <div class="grid grid-cols-2 gap-4">
      <button id="btn-laender" onclick="selectCategory('laender')" class="p-4 bg-slate-800 rounded-2xl border-2 border-indigo-500 font-medium text-left transition shadow-md">
        🌍 Kursmünzen
      </button>
      <button id="btn-gedenk" onclick="selectCategory('gedenk')" class="p-4 bg-slate-800 rounded-2xl border-2 border-transparent font-medium text-left transition shadow-md text-slate-400">
        ⭐ 2€ Gedenkmünzen
      </button>
    </div>

    <!-- Neues Land / Neue Kategorie hinzufügen -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700/50 shadow-lg space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Eintrag hinzufügen</h2>
      <div class="flex gap-2">
        <input type="text" id="new-country-name" placeholder="z. B. Deutschland..." class="flex-1 p-3 border border-slate-600 rounded-xl bg-slate-900 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="addCountry()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-medium hover:bg-indigo-500 transition shadow-md">
          Hinzufügen
        </button>
      </div>
    </div>

    <!-- Raster / Grid der erfassten Länder -->
    <div class="space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Übersicht</h2>
      <!-- Block-Grid (2 Spalten auf Handys, 3 auf größeren Bildschirmen) -->
      <div id="country-list" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <p class="text-sm text-slate-500 italic col-span-2 sm:col-span-3">Lade Einträge...</p>
      </div>
    </div>

  </div>

  <!-- Detail-Modal für Münzen eines Landes -->
  <div id="coin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-lg w-full space-y-4 max-h-[90vh] flex flex-col shadow-2xl text-white">
      
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 id="modal-title" class="font-bold text-lg text-white">Münzen verwalten</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
      </div>

      <!-- Eingabe für neue Münzen -->
      <div class="bg-slate-900 p-3 rounded-2xl border border-slate-700 space-y-3">
        <div class="flex gap-2">
          <input type="text" id="coin-value" placeholder="Münzwert (z. B. 2 Euro, 10 Cent)" class="flex-1 p-2 border border-slate-700 rounded-xl bg-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <label class="flex items-center gap-2 text-sm font-medium px-2 cursor-pointer text-slate-300">
            <input type="checkbox" id="coin-owned" class="w-4 h-4 text-indigo-600 rounded">
            Vorhanden
          </label>
        </div>
        <button onclick="saveCoin()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-500 transition">
          Münze speichern
        </button>
      </div>

      <!-- Münzliste inside Modal -->
      <div id="coin-list" class="space-y-2 overflow-y-auto flex-1 pr-1">
        <!-- Dynamische Befüllung durch JavaScript -->
      </div>

      <button onclick="closeModal()" class="w-full py-2.5 bg-slate-700 text-slate-200 font-medium rounded-xl hover:bg-slate-600 transition text-sm">
        Schließen
      </button>
    </div>
  </div>

  <!-- JavaScript-Einbindung mit Cache-Buster Parameter v1.0.4 -->
  <script src="app.js?v=1.0.4"></script>
</body>
</html>
